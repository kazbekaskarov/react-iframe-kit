name: Bug report
description: Something doesn't work as documented
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For security issues, please use a private advisory instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A link (StackBlitz, CodeSandbox, repo) or a short code sample. Iframe bugs are often browser-specific, so a runnable repro helps most.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Same-origin (<Frame> / portal)
        - Cross-origin (src=URL + react-iframe-kit/child)
        - Not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: react-iframe-kit (host and child, if they differ), React, browser(s)
      placeholder: react-iframe-kit 0.3.1 / child 0.3.0, React 19.3, Firefox 145
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Debug log
      description: Console output with `debug: true` on both sides, if relevant.
      render: text
