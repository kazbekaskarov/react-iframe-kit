name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build, package, size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm size

  unit:
    name: Unit (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use React ${{ matrix.react }}
        if: matrix.react != 19
        run: >-
          pnpm add -D react@${{ matrix.react }} react-dom@${{ matrix.react }}
          @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: pnpm test:coverage

  e2e:
    name: E2E (${{ matrix.project }}, React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, engine: chromium, react: 19 }
          - { project: firefox, engine: firefox, react: 19 }
          - { project: webkit, engine: webkit, react: 19 }
          # iPhone viewport and touch input, on the embed paths (playwright.config.ts).
          - { project: mobile-webkit, engine: webkit, react: 19 }
          # The peer range starts at 18; the unit job can't see React 18's scheduling
          # in a real browser (an update loop only showed up here).
          - { project: chromium, engine: chromium, react: 18 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use React ${{ matrix.react }}
        if: matrix.react != 19
        run: >-
          pnpm add -D react@${{ matrix.react }} react-dom@${{ matrix.react }}
          @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      # e2e/dual.spec.ts loads the built ESM and CJS copies.
      - run: pnpm build
      - run: pnpm test:e2e --project=${{ matrix.project }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-react${{ matrix.react }}
          path: playwright-report/
          retention-days: 14

  skew:
    name: Version skew (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # The latest published build; the spec skips (with the reason) whatever that
      # build doesn't export yet.
      - run: pnpm skew:fetch
      - run: pnpm test:skew --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-skew-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  examples:
    name: Example (${{ matrix.example }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # A real Next.js App Router app: server components importing the package,
          # 'use client' boundaries, and the handshake after hydration.
          - { example: nextjs, browsers: chromium }
          # A loader script on a site without React, on two origins.
          - { example: vanilla-widget, browsers: chromium firefox webkit }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack --out react-iframe-kit.tgz
      # The example as users install it, with the library replaced by this build.
      - name: Install the example
        working-directory: examples/${{ matrix.example }}
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --no-save ../../react-iframe-kit.tgz
      - if: matrix.example == 'nextjs'
        working-directory: examples/nextjs
        run: npx next build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browsers }}
      - run: pnpm exec playwright test -c examples/${{ matrix.example }}/playwright.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-example-${{ matrix.example }}
          path: playwright-report/
          retention-days: 14
