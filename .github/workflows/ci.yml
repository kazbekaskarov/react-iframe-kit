name: CI
on:
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: timeout 150 pnpm exec playwright test --project=chromium --reporter=line
        env:
          DEBUG: pw:webserver,pw:browser,pw:api
      - if: always()
        run: ps -ef --forest | grep -v "ps -ef" | tail -40
