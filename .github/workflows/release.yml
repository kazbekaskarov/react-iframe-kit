name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write       # version commits and tags
  pull-requests: write  # the "Version Packages" PR
  id-token: write       # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # No `registry-url` here: it writes an .npmrc with an empty token, which would
      # shadow the OIDC token exchange used by npm trusted publishing.
      - run: pnpm install --frozen-lockfile
      # Opens or updates the "Version Packages" PR while changesets are pending;
      # publishes to npm once that PR is merged.
      - uses: changesets/action@v2
        id: changesets
        with:
          # Also pins the README's CDN snippets to the new version, with its SRI hash.
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      # The snippets were hashed from the version PR's build; the build is
      # reproducible, but check against what npm actually serves.
      - name: Check the CDN snippets against the published files
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/cdn-snippets.mjs --check
