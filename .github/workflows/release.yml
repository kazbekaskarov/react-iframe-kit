name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write       # version commits and tags
  pull-requests: write  # the "Version Packages" PR
  id-token: write       # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the snippet check may wait up to 10 min for the registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # No `registry-url` here: it writes an .npmrc with an empty token, which would
      # shadow the OIDC token exchange used by npm trusted publishing.
      - run: pnpm install --frozen-lockfile
      # Opens or updates the "Version Packages" PR while changesets are pending;
      # publishes to npm once that PR is merged.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          # Also pins the README's CDN snippets to the new version, with its SRI hash.
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      # The snippets were hashed from the version PR's build; the build is
      # reproducible, but check against what npm actually serves.
      - name: Check the CDN snippets against the published files
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/cdn-snippets.mjs --check
